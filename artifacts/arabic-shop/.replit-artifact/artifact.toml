kind = "mobile"
previewPath = "/"
title = "Arabic E-Commerce App"
version = "1.0.0"
id = "artifacts/arabic-shop"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20426

[services.development]
run = "pnpm --filter @workspace/arabic-shop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arabic-shop", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/arabic-shop", "run", "serve" ]

[services.env]
PORT = "20426"
BASE_PATH = "/"
